# 大教会のアイテム配置
#
# 座標は地図画像の原寸を基準としたピクセル値です(x: 0〜2338 / y: 0〜1654)。
# 画像を開いて読んだ座標をそのまま書いてください。アイコンの中心がその位置に来ます。
#   画像: src/assets/maps/great-church/great_church_type_a_dark_*.webp
#
# item に書ける値 (src/data/nightreign-map-item-types.ts で定義):
#   common_chest ... 宝箱
#   rare_chest   ... レアな宝箱
#   corpse       ... 死体
#
# types のキーは地図のタイプid、floors のキーは階層idです。
# アイテムが無い階層は行ごと省略できます。
# 書き間違いはビルド時にエラーになります (pnpm build で確認できます)。

types:
  # タイプA
  a:
    - name: 配置1
      floors:
        2f: []
        1f:
          # ↓ 位置の見当を付けるための仮置きです。実際の座標に書き換えてください
          - { item: common_chest, x: 760, y: 300 }
          - { item: rare_chest, x: 1050, y: 620 }
          - { item: corpse, x: 620, y: 1080 }
        b1: []

    - name: 配置2
      floors:
        1f:
          - { item: rare_chest, x: 1500, y: 400 }
        b1:
          - { item: common_chest, x: 900, y: 250 }
