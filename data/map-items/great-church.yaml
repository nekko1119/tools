# 大教会のアイテム配置
#
# 座標は地図画像の原寸を基準としたピクセル値です(x: 0〜2338 / y: 0〜1654)。
# 画像を開いて読んだ座標をそのまま書いてください。アイコンの中心がその位置に来ます。
#   画像: src/assets/maps/great-church/great_church_type_a_dark_*.webp
#
# item に書ける値 (src/data/nightreign-map-item-types.ts で定義):
#   common_chest ... 宝箱
#   rare_chest   ... レア宝箱
#   corpse       ... 遺体
#   sacred_seal  ... 聖印
#
# name は画面のセレクタに出る名前です。拠点内で重複させないでください。
# type はどの地図を表示するかで、地図のタイプidを書きます。
# floors のキーは、そのタイプの階層idです。アイテムが無い階層は行ごと省略できます。
# 書き間違いはビルド時にエラーになります (pnpm build で確認できます)。

patterns:
  - name: 無(霊廟騎士)
    type: a
    floors:
      2f:
        - { item: common_chest, x: 850, y: 500 }
        - { item: common_chest, x: 760, y: 1020 }
      1f:
        - { item: rare_chest, x: 700, y: 760 }
        - { item: corpse, x: 750, y: 760 }
      b1:
        - { item: common_chest, x: 1050, y: 290 }
        - { item: corpse, x: 1200, y: 350 }
        - { item: sacred_seal, x: 1320, y: 720 }

  - name: 炎(火の僧兵)
    type: a
    floors:
      2f:
        - { item: corpse, x: 800, y: 500 }
        - { item: common_chest, x: 860, y: 980 }
      1f:
        - { item: rare_chest, x: 700, y: 760 }
        - { item: common_chest, x: 1500, y: 720 }
        - { item: corpse, x: 1270, y: 1000 }
      b1:
        - { item: corpse, x: 1050, y: 290 }
        - { item: corpse, x: 1200, y: 350 }
        - { item: sacred_seal, x: 1320, y: 720 }
  - name: 無(ガーディアン・ゴーレム)
    type: b
    floors:
      2f:
        - { item: sacred_seal, x: 1060, y: 1140 }
        - { item: corpse, x: 750, y: 940 }
        - { item: corpse, x: 980, y: 1120 }
        - { item: corpse, x: 1360, y: 840 }
        - { item: common_chest, x: 1430, y: 890 }
      1f:
        - { item: rare_chest, x: 700, y: 760 }
        - { item: corpse, x: 1660, y: 820 }
  - name: 聖(信託の使者たち)
    type: b
    floors:
      2f:
        - { item: rare_chest, x: 1060, y: 1140 }
