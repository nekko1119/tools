# 大教会のアイテム配置
#
# 座標は地図画像の原寸を基準としたピクセル値です(x: 0〜2338 / y: 0〜1654)。
# 画像を開いて読んだ座標をそのまま書いてください。アイコンの中心がその位置に来ます。
#   画像: src/assets/maps/great-church/great_church_type_a_dark_*.webp
#
# item に書ける値 (src/data/nightreign-map-item-types.ts で定義):
#   common_chest ... 宝箱
#   rare_chest   ... レア宝箱
#   corpse       ... 遺体
#   sacred_seal  ... 聖印
#
# types のキーは地図のタイプid、floors のキーは階層idです。
# アイテムが無い階層は行ごと省略できます。
# 書き間違いはビルド時にエラーになります (pnpm build で確認できます)。

types:
  # タイプA - 地下がある
  a:
    - name: 無(霊廟騎士)
      floors:
        2f:
          - { item: common_chest, x: 850, y: 500 }
          - { item: common_chest, x: 760, y: 1020 }
        1f:
          - { item: rare_chest, x: 700, y: 760 }
          - { item: corpse, x: 750, y: 760 }
        b1:
          - { item: common_chest, x: 1050, y: 290 }
          - { item: corpse, x: 1200, y: 350 }
          - { item: sacred_seal, x: 1320, y: 720 }
    - name: 炎(火の僧兵)
      floors:
        2f:
          - { item: corpse, x: 860, y: 500 }
          - { item: common_chest, x: 820, y: 1000 }
        1f:
          - { item: rare_chest, x: 700, y: 760 }
          - { item: common_chest, x: 1520, y: 760 }
          - { item: corpse, x: 1270, y: 1000 }
        b1:
          - { item: corpse, x: 1050, y: 290 }
          - { item: corpse, x: 1200, y: 350 }
          - { item: sacred_seal, x: 1320, y: 720 }
